services:
  postgres:
    image: postgres:17-alpine
    container_name: enredex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: enredex
      POSTGRES_PASSWORD: enredex
      POSTGRES_DB: enredex
    ports:
      - "5432:5432"
    volumes:
      - enredex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enredex -d enredex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  enredex-pgdata:
