services:
  # --- Reverse proxy (SSL termination) ---
  traefik:
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
    networks:
      - traefik
    restart: unless-stopped

  # --- Database ---
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enredex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-enredex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enredex} -d ${POSTGRES_DB:-enredex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Run migrations once, then exit ---
  db-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "cd packages/database && npx drizzle-kit migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enredex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enredex}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- API ---
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-enredex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enredex}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      WEB_URL: https://${WEB_HOST:?WEB_HOST required}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Enredex <no-reply@enredex.local>}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_HOST:?API_HOST required}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
    networks:
      - traefik
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Web frontend ---
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${WEB_HOST:?WEB_HOST required}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    driver: bridge
  internal:
    driver: bridge

volumes:
  pgdata:
